<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureSPC | Surgical Auditor v2.6</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root { --surgical-red: #dc3545; --clinical-blue: #0d6efd; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; color: #1e293b; }
        .scanner-card { border: none; border-radius: 15px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        #drop-zone { border: 3px dashed #cbd5e1; border-radius: 15px; padding: 40px; text-align: center; cursor: pointer; background: #f8fafc; }
        #drop-zone.dragover { border-color: var(--clinical-blue); background: #f0f7ff; border-style: solid; }
        .summary-box { background: #fff5f5; border-left: 5px solid var(--surgical-red); padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .log-container { max-height: 550px; overflow-y: auto; background: #0f172a; color: #38bdf8; font-family: 'Cascadia Code', 'Courier New', monospace; padding: 25px; border-radius: 10px; border: 1px solid #334155; white-space: pre-wrap; }
        .error-text { color: #f87171; font-weight: bold; }
        .warning-text { color: #fbbf24; font-weight: bold; margin-bottom: 8px; display: block; }
        .success-text { color: #4ade80; font-weight: bold; }
        .suggestion-tip { color: #a5f3fc; font-size: 0.85rem; font-family: 'Segoe UI', sans-serif; display: block; margin-top: 2px; margin-left: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">🩺 SecureSPC <span class="text-info">Surgical Auditor v2.6</span></span>
        <div class="d-flex gap-2">
            <button onclick="location.reload()" class="btn btn-outline-light btn-sm">Reset</button>
            <a href="index.html" class="btn btn-info btn-sm fw-bold">Open Analyzer</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="mb-4 text-center">
                <h2 class="fw-bold text-dark">Data Integrity Audit</h2>
                <p class="text-muted">Detecting sequence breaks and guiding date-time formatting.</p>
            </div>

            <div class="scanner-card p-4 mb-4">
                <div id="drop-zone">
                    <div id="drop-text">
                        <h5 class="fw-bold">Drop CSV here to Audit</h5>
                        <p class="mb-0 text-secondary small">Scroll down for instructional feedback on errors.</p>
                    </div>
                    <input type="file" id="csv-input" style="display: none;" accept=".csv">
                </div>
            </div>

            <div id="mapping-section" class="scanner-card p-4 mb-4" style="display: none;">
                <div class="row align-items-center g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted">TIMELINE COLUMN (X)</label>
                        <select id="x-col" class="form-select border-primary"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted">MEASURE COLUMN (Y)</label>
                        <select id="y-col" class="form-select border-primary"></select>
                    </div>
                    <div class="col-md-4 d-flex align-items-end pt-2">
                        <div class="form-check form-switch me-3">
                            <input class="form-check-input" type="checkbox" id="euro-mode">
                            <label class="form-check-label small fw-bold" for="euro-mode">Euro Decimals</label>
                        </div>
                        <button id="run-scan" class="btn btn-danger btn-lg flex-grow-1 fw-bold shadow">AUDIT DATA</button>
                    </div>
                </div>
            </div>

            <div id="results-section" style="display: none;">
                <div id="summary-area" class="summary-box shadow-sm"></div>
                <div id="audit-log" class="log-container">Initializing...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    const dropZone = document.getElementById('drop-zone');
    const csvInput = document.getElementById('csv-input');
    const mappingSection = document.getElementById('mapping-section');
    const resultsSection = document.getElementById('results-section');
    const auditLog = document.getElementById('audit-log');
    const summaryArea = document.getElementById('summary-area');

    window.addEventListener("dragover", e => e.preventDefault(), false);
    window.addEventListener("drop", e => e.preventDefault(), false);

    ['dragenter', 'dragover'].forEach(n => dropZone.addEventListener(n, (e) => {
        e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover');
    }, false));

    ['dragleave', 'drop'].forEach(n => dropZone.addEventListener(n, (e) => {
        e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('dragover');
    }, false));

    dropZone.addEventListener('drop', e => {
        const files = e.dataTransfer.files;
        if (files.length) handleFile(files[0]);
    }, false);

    dropZone.onclick = () => csvInput.click();
    csvInput.onchange = (e) => { if (e.target.files.length) handleFile(e.target.files[0]); };

    function handleFile(file) {
        Papa.parse(file, {
            header: true, skipEmptyLines: 'greedy',
            complete: function(results) {
                rawData = results.data;
                const headers = results.meta.fields;
                const xS = document.getElementById('x-col');
                const yS = document.getElementById('y-col');
                xS.innerHTML = ''; yS.innerHTML = '';
                headers.forEach(h => {
                    if(h && h.trim() !== "") {
                        let opt = document.createElement('option'); opt.value = h; opt.innerText = h;
                        xS.appendChild(opt.cloneNode(true)); yS.appendChild(opt);
                    }
                });
                mappingSection.style.display = 'block';
                document.getElementById('drop-text').innerHTML = `<h5 class="fw-bold text-success">✔ File Ready</h5><p class="mb-0 text-secondary">${file.name}</p>`;
            }
        });
    }

    document.getElementById('run-scan').onclick = function() {
        const x = document.getElementById('x-col').value;
        const y = document.getElementById('y-col').value;
        const isEuro = document.getElementById('euro-mode').checked;
        resultsSection.style.display = 'block';

        let stats = { blanks: 0, badFormats: 0, badNumbers: 0, clean: 0 };
        let sequenceBreaks = 0; let duplicateX = 0;
        let lastTimeValue = 0; let seenDates = new Set();
        let logHtml = "";

        rawData.forEach((row, index) => {
            const rowNum = index + 2;
            let rowHasHardError = false;

            // 1. Timeline Audit
            const dVal = row[x] ? row[x].toString().trim() : "";
            if (dVal === "" || dVal === "-") {
                stats.blanks++;
                rowHasHardError = true;
                logHtml += `<div class="error-text">[ROW ${rowNum}] Gap Detected: Timeline is empty.</div>`;
            } else {
                const isDate = /^\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{4}$/.test(dVal);
                const isYear = /^\d{4}$/.test(dVal);
                const isDateTime = /^\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{4}\s\d{1,2}:\d{2}$/.test(dVal);

                if (!isDate && !isYear && !isDateTime) {
                    stats.badFormats++;
                    logHtml += `<span class="warning-text">[ROW ${rowNum}] Format Error: "${dVal}" is not a valid date.</span>`;
                    logHtml += `<span class="suggestion-tip">💡 Suggestion: Use "DD/MM/YYYY HH:MM" (e.g., 10/05/2026 14:30) or standard "DD/MM/YYYY"</span>`;
                }

                // Sequence Check (Simple reverse parse)
                const currentTS = new Date(dVal.split(/[\/\-\.\s:]/)[2], dVal.split(/[\/\-\.\s:]/)[1]-1, dVal.split(/[\/\-\.\s:]/)[0]).getTime();
                if (!isNaN(currentTS)) {
                    if (lastTimeValue > 0 && currentTS < lastTimeValue) sequenceBreaks++;
                    if (seenDates.has(dVal)) duplicateX++;
                    seenDates.add(dVal);
                    lastTimeValue = currentTS;
                }
            }

            // 2. Measure Audit
            const rawM = row[y] ? row[y].toString().trim() : "";
            if (rawM === "") {
                stats.badNumbers++;
                rowHasHardError = true;
            } else {
                let cleanM = rawM.replace(/\s+/g, '');
                if (cleanM.includes(',')) {
                    if (!isEuro) cleanM = cleanM.replace(/,/g, '');
                    else cleanM = cleanM.replace(',', '.');
                }
                if (isNaN(parseFloat(cleanM))) {
                    stats.badNumbers++;
                    rowHasHardError = true;
                    logHtml += `<div class="error-text">[ROW ${rowNum}] Value Error: "${rawM}" is not numeric.</div>`;
                }
            }
            if (!rowHasHardError) stats.clean++;
        });

        let coachAdvice = "";
        if (sequenceBreaks > 0) coachAdvice += `<div class="alert alert-warning mb-2">⚠️ <strong>Sequence Break:</strong> Data is out of chronological order. Sort your file in Excel!</div>`;
        if (duplicateX > 0) coachAdvice += `<div class="alert alert-info mb-0">💡 <strong>Multiple entries per date:</strong> For higher accuracy, combine Date + Time into one column.</div>`;

        summaryArea.innerHTML = `
            <h5 class="fw-bold text-danger mb-3">Audit Summary</h5>
            ${coachAdvice}
            <hr>
            <ul class="list-unstyled mb-0">
                <li>🔴 <strong>${stats.blanks}</strong> Gaps | 🟡 <strong>${stats.badFormats}</strong> Formats | 🔴 <strong>${stats.badNumbers}</strong> Non-Numeric</li>
            </ul>
        `;
        auditLog.innerHTML = logHtml || `<div class="success-text">SCAN COMPLETE: DATA IS READY FOR ANALYSIS.</div>`;
        resultsSection.scrollIntoView({ behavior: 'smooth' });
    };
</script>
</body>
</html>
