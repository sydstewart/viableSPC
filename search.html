<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://stepchangeanalysis.com/search.html">
    <title>Search — StepChangeAnalysis.com</title>
    <meta name="description" content="Search all pages on StepChangeAnalysis.com — concepts, examples, improvement method, and Bootstrap CUSUM guides.">
    <meta name="robots" content="noindex">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NZLMMS3ZGG"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-NZLMMS3ZGG");</script>

    <link rel="stylesheet" href="assets/styles.css">
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
    <style>
        .search-wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 20px 60px;
            font-family: system-ui, sans-serif;
        }
        .search-wrap h1 {
            font-size: 1.6em;
            color: var(--brand-blue);
            margin: 0 0 8px;
        }
        .search-wrap p {
            color: var(--muted);
            font-size: 0.92em;
            margin: 0 0 28px;
            line-height: 1.6;
        }
        /* Pagefind UI overrides to match site style */
        .pagefind-ui__search-input {
            border: 2px solid var(--border) !important;
            border-radius: 6px !important;
            font-size: 1em !important;
            padding: 10px 14px !important;
            font-family: system-ui, sans-serif !important;
        }
        .pagefind-ui__search-input:focus {
            border-color: var(--brand-blue) !important;
            outline: none !important;
        }
        .pagefind-ui__result-link {
            color: var(--brand-blue) !important;
            font-weight: 600 !important;
        }
        .pagefind-ui__result-excerpt {
            font-size: 0.88em !important;
            line-height: 1.6 !important;
            color: var(--text) !important;
        }
        .pagefind-ui__button {
            background: var(--brand-blue) !important;
            border-radius: 6px !important;
            font-family: system-ui, sans-serif !important;
            color: white !important;
            font-weight: 600 !important;
            font-size: 0.95em !important;
            padding: 12px 24px !important;
            cursor: pointer !important;
        }
    </style>
</head>
<body>

<div id="site-header"></div>

<main>
    <div class="search-wrap">

        <div class="breadcrumb"><a href="index.html">Home</a> &rsaquo; Search</div>

        <h1>Search the site</h1>
        <p>Search all pages — concepts, examples, improvement method, Bootstrap CUSUM guides, and case studies. Try searching for <em>Watford</em>, <em>regression to the mean</em>, <em>Joiner</em>, or <em>corridor care</em>.</p>

        <div id="search"></div>

    </div>
</main>

<div id="site-footer"></div>
<script src="assets/site-chrome.js"></script>
<script src="/pagefind/pagefind-ui.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', function() {
        new PagefindUI({
            element: '#search',
            showImages: false,
            excerptLength: 30,
            resetStyles: false,
            translations: {
                placeholder: 'Search StepChangeAnalysis.com...',
                zero_results: 'No results for [SEARCH_TERM] — try a different term'
            }
        });

        // Auto-focus search box on page load
        setTimeout(function() {
            var input = document.querySelector('.pagefind-ui__search-input');
            if (input) input.focus();
        }, 100);

        // Support ?q= URL parameter — so links like search.html?q=watford work
        var params = new URLSearchParams(window.location.search);
        var q = params.get('q');
        if (q) {
            setTimeout(function() {
                var input = document.querySelector('.pagefind-ui__search-input');
                if (input) {
                    input.value = q;
                    input.dispatchEvent(new Event('input'));
                }
            }, 200);
        }
    });
</script>
</body>
</html>
