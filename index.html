<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local SPC Analyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 1200px; margin: auto; background-color: #f8f9fa; }
        .upload-box { border: 2px dashed #ccc; padding: 30px; text-align: center; margin-bottom: 20px; border-radius: 8px; background-color: white; }

        /* Two-Row Control Panel */
        #controls {
            display: none;
            background: #f0f4f8; padding: 20px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid #cce5ff;
            flex-direction: column; gap: 20px;
        }

        /* Top Row for Title */
        .title-row { width: 100%; border-bottom: 1px solid #d0dae5; padding-bottom: 15px; }
        #chartTitleInput { width: 100%; max-width: 800px; font-size: 1.1em; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

        /* Bottom Row for Settings */
        .settings-row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }

        .control-group { display: flex; flex-direction: column; font-size: 0.85em; font-weight: bold; color: #444; }
        .control-group input, .control-group select { padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; background: white; }

        .num-input { width: 80px; }
        .select-input { min-width: 130px; }

        #recalcBtn {
            padding: 10px 25px; background: #0056b3; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; height: 38px;
        }
        #recalcBtn:hover { background: #003d82; }
    </style>
</head>
<body>

    <h1>Browser-Based SPC Analyzer</h1>
    <p>100% Secure. Your data never leaves your computer.</p>

    <div class="upload-box">
        <input type="file" id="csvInput" accept=".csv" disabled />
        <p id="statusText">Waiting for Python engine to boot...</p>
    </div>

    <div id="controls">
        <!-- ROW 1: Title -->
        <div class="title-row">
            <div class="control-group">
                <label>Chart Title:</label>
                <input type="text" id="chartTitleInput" value="Step Change Analysis" placeholder="Enter chart name here...">
            </div>
        </div>

        <!-- ROW 2: Technical Parameters -->
        <div class="settings-row">
            <div class="control-group">
                <label>X-Axis (Date):</label>
                <select id="xColSelect" class="select-input"></select>
            </div>

            <div class="control-group">
                <label>Y-Axis (Value):</label>
                <select id="yColSelect" class="select-input"></select>
            </div>

            <div class="control-group">
                <label>Date Style:</label>
                <select id="dateFormatSelect" class="select-input">
                    <option value="auto">Auto-detect</option>
                    <option value="dd/mm/yyyy">DD/MM/YYYY (UK/EU)</option>
                    <option value="mm/dd/yyyy">MM/DD/YYYY (US)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Turn Length:</label>
                <input type="number" id="paramTurnLength" class="num-input" value="5">
            </div>

            <div class="control-group">
                <label>Loops:</label>
                <input type="number" id="paramBootNum" class="num-input" value="1000">
            </div>

            <div class="control-group">
                <label>Conf %:</label>
                <input type="number" id="paramConfLimit" class="num-input" value="95">
            </div>

            <button id="recalcBtn">Recalculate Chart</button>
        </div>
    </div>

    <div id="stats"></div>
    <div id="chart-container"></div>

    <script src="app.js"></script>
</body>
</html>
