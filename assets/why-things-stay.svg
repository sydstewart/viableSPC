<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="1300" height="900" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f4d5a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d9e75"/></marker></defs>
<rect width="1300" height="900" fill="#fff"/>
<text x="650" y="48" font-size="28" font-weight="700" fill="#002d5b" text-anchor="middle">Why things stay the way they are</text>
<rect x="30" y="140" width="190" height="560" rx="14" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
<text x="125" y="180" font-size="20" font-weight="700" fill="#3f4d5a" text-anchor="middle">Strategy</text>
<text x="125" y="215" font-size="15" fill="#3f4d5a" text-anchor="middle">the boundary</text>
<text x="125" y="239" font-size="15" fill="#3f4d5a" text-anchor="middle">and direction</text>
<text x="125" y="263" font-size="15" fill="#3f4d5a" text-anchor="middle"></text>
<text x="125" y="287" font-size="15" fill="#3f4d5a" text-anchor="middle">sets the focus</text>
<text x="125" y="311" font-size="15" fill="#3f4d5a" text-anchor="middle">and the</text>
<text x="125" y="335" font-size="15" fill="#3f4d5a" text-anchor="middle">trade-offs</text>
<rect x="1080" y="140" width="190" height="560" rx="14" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
<text x="1175" y="180" font-size="20" font-weight="700" fill="#3f4d5a" text-anchor="middle">Capability</text>
<text x="1175" y="215" font-size="15" fill="#3f4d5a" text-anchor="middle">the ceiling</text>
<text x="1175" y="239" font-size="15" fill="#3f4d5a" text-anchor="middle">and capacity</text>
<text x="1175" y="263" font-size="15" fill="#3f4d5a" text-anchor="middle"></text>
<text x="1175" y="287" font-size="15" fill="#3f4d5a" text-anchor="middle">skills,</text>
<text x="1175" y="311" font-size="15" fill="#3f4d5a" text-anchor="middle">resources and</text>
<text x="1175" y="335" font-size="15" fill="#3f4d5a" text-anchor="middle">operational</text>
<text x="1175" y="359" font-size="15" fill="#3f4d5a" text-anchor="middle">maturity</text>
<text x="650" y="140" font-size="16" font-weight="700" fill="#3f4d5a" text-anchor="middle">Strategy and capability set the limits of the loop</text>
<rect x="250" y="198" width="300" height="104" rx="14" fill="#7b72d6"/>
<text x="400" y="238" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Conditions</text>
<text x="400" y="266" font-size="15" fill="#fff" text-anchor="middle">rules, workflows, measures,</text>
<text x="400" y="286" font-size="15" fill="#fff" text-anchor="middle">rewards and structures</text>
<rect x="750" y="198" width="300" height="104" rx="14" fill="#c46fc1"/>
<text x="900" y="238" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Beliefs</text>
<text x="900" y="266" font-size="15" fill="#fff" text-anchor="middle">mental models,</text>
<text x="900" y="286" font-size="15" fill="#fff" text-anchor="middle">assumptions and culture</text>
<rect x="750" y="548" width="300" height="104" rx="14" fill="#c46fc1"/>
<text x="900" y="588" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Behaviours</text>
<text x="900" y="616" font-size="15" fill="#fff" text-anchor="middle">daily actions,</text>
<text x="900" y="636" font-size="15" fill="#fff" text-anchor="middle">decisions and habits</text>
<rect x="250" y="548" width="300" height="104" rx="14" fill="#3f4d5a"/>
<text x="400" y="588" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Results</text>
<text x="400" y="616" font-size="15" fill="#fff" text-anchor="middle">outcomes and data</text>
<text x="400" y="636" font-size="15" fill="#fff" text-anchor="middle">(lagging)</text>
<path d="M552,242 L742,242" stroke="#3f4d5a" stroke-width="3" marker-end="url(#ah)"/>
<text x="650" y="228" font-size="15" font-weight="700" fill="#3f4d5a" text-anchor="middle">shape silently</text>
<text x="650" y="268" font-size="13" fill="#3f4d5a" text-anchor="middle">what is rewarded,</text>
<text x="650" y="285" font-size="13" fill="#3f4d5a" text-anchor="middle">punished, measured,</text>
<text x="650" y="302" font-size="13" fill="#3f4d5a" text-anchor="middle">made easy or hard</text>
<path d="M900,304 L900,540" stroke="#3f4d5a" stroke-width="3" marker-end="url(#ah)"/>
<text x="918" y="425" font-size="15" font-weight="700" fill="#3f4d5a">drive</text>
<path d="M748,600 L556,600" stroke="#3f4d5a" stroke-width="3" marker-end="url(#ah)"/>
<text x="650" y="584" font-size="15" font-weight="700" fill="#3f4d5a" text-anchor="middle">produce</text>
<path d="M400,546 L400,310" stroke="#3f4d5a" stroke-width="3" marker-end="url(#ah)"/>
<text x="382" y="410" font-size="15" font-weight="700" fill="#3f4d5a" text-anchor="end">reinforce</text>
<text x="382" y="432" font-size="13" fill="#3f4d5a" text-anchor="end">budgets, targets</text>
<text x="382" y="449" font-size="13" fill="#3f4d5a" text-anchor="end">and rules are set</text>
<text x="382" y="466" font-size="13" fill="#3f4d5a" text-anchor="end">from last results</text>
<path d="M520,550 L800,306" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ahr)"/>
<text x="688" y="480" font-size="14" fill="#c0392b" font-weight="600">and seem to prove</text>
<text x="688" y="498" font-size="14" fill="#c0392b" font-weight="600">the beliefs right</text>
<text x="560" y="400" font-size="17" font-weight="700" fill="#c0392b" text-anchor="middle">A reinforcing</text>
<text x="560" y="422" font-size="17" font-weight="700" fill="#c0392b" text-anchor="middle">loop</text>
<path d="M300,120 C330,140 350,160 365,192" stroke="#1d9e75" stroke-width="3" fill="none" marker-end="url(#ahg)"/>
<rect x="240" y="66" width="250" height="50" rx="8" fill="#e6f4ef" stroke="#1d9e75" stroke-width="1.6"/>
<text x="365" y="88" font-size="15" font-weight="700" fill="#0f6e56" text-anchor="middle">Where leaders can act</text>
<text x="365" y="107" font-size="13" fill="#0f6e56" text-anchor="middle">redesign the conditions</text>
<rect x="240" y="690" width="820" height="52" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="262" y="722" font-size="16" fill="#8f2a1f"><tspan font-weight="700">The trap: </tspan>when results are poor, stuck leaders take them as proof their beliefs are right</text>
<rect x="240" y="756" width="820" height="76" rx="10" fill="#e6f4ef" stroke="#1d9e75" stroke-width="1.6"/>
<text x="262" y="787" font-size="16" fill="#0f6e56"><tspan font-weight="700">The way out: </tspan>change your own thinking, then redesign the conditions.</text>
<text x="262" y="813" font-size="16" fill="#0f6e56">New experience changes everyone&#8217;s beliefs.</text>
<text x="1270" y="880" font-size="12" fill="#64748b" text-anchor="end">stepchangeanalysis.com</text>
