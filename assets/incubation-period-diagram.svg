<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- title -->
  <text x="60" y="58" font-size="30" font-weight="700" fill="#002d5b">The incubation period</text>
  <text x="60" y="92" font-size="19" fill="#3f4d5a">Warning signs build up before a major failure, and each one gets explained away</text>

  <!-- incubation band -->
  <rect x="270" y="128" width="620" height="272" rx="10" fill="#fdf3e4"/>
  <text x="580" y="154" font-size="17" font-weight="700" fill="#8a5410" text-anchor="middle">INCUBATION PERIOD</text>

  <!-- phase labels -->
  <text x="165" y="154" font-size="17" font-weight="700" fill="#3f4d5a" text-anchor="middle">NORMAL OPERATION</text>
  <text x="955" y="154" font-size="17" font-weight="700" fill="#3f4d5a" text-anchor="middle">TRIGGER</text>

  <!-- rising risk curve -->
  <path d="M 70 352 C 300 350, 520 330, 700 280 S 930 190, 1040 175" fill="none" stroke="#c97a1a" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="78" y="336" font-size="15" fill="#8a5410">hidden risk builds up</text>

  <!-- time axis -->
  <line x1="60" y1="410" x2="1060" y2="410" stroke="#3f4d5a" stroke-width="3"/>
  <polygon points="1060,402 1076,410 1060,418" fill="#3f4d5a"/>
  <text x="60" y="436" font-size="15" fill="#3f4d5a">time</text>

  <!-- warning markers: (x, label, y-level) -->
  <g font-size="15" fill="#2c2c2b">
    <g><line x1="320" y1="410" x2="320" y2="300" stroke="#c97a1a" stroke-width="2"/><circle cx="320" cy="300" r="9" fill="#c97a1a"/><text x="320" y="282" text-anchor="middle">near-miss</text></g>
    <g><line x1="410" y1="410" x2="410" y2="240" stroke="#c97a1a" stroke-width="2"/><circle cx="410" cy="240" r="9" fill="#c97a1a"/><text x="410" y="222" text-anchor="middle">recurring fault</text></g>
    <g><line x1="505" y1="410" x2="505" y2="320" stroke="#c97a1a" stroke-width="2"/><circle cx="505" cy="320" r="9" fill="#c97a1a"/><text x="505" y="302" text-anchor="middle">complaint</text></g>
    <g><line x1="600" y1="410" x2="600" y2="215" stroke="#c97a1a" stroke-width="2"/><circle cx="600" cy="215" r="9" fill="#c97a1a"/><text x="600" y="197" text-anchor="middle">data drifting</text></g>
    <g><line x1="695" y1="410" x2="695" y2="330" stroke="#c97a1a" stroke-width="2"/><circle cx="695" cy="330" r="9" fill="#c97a1a"/><text x="695" y="312" text-anchor="middle">alarm ignored</text></g>
    <g><line x1="805" y1="410" x2="805" y2="235" stroke="#c97a1a" stroke-width="2"/><circle cx="805" cy="235" r="9" fill="#c97a1a"/><text x="805" y="207" text-anchor="middle">similar accident</text><text x="805" y="224" text-anchor="middle">elsewhere</text></g>
  </g>

  <!-- explained away bracket -->
  <path d="M 300 452 L 300 466 L 860 466 L 860 452" fill="none" stroke="#8a5410" stroke-width="2"/>
  <text x="580" y="492" font-size="16" fill="#8a5410" text-anchor="middle" font-style="italic">Each noticed by someone, each explained away:</text>
  <text x="580" y="514" font-size="16" fill="#8a5410" text-anchor="middle" font-style="italic">&#8220;it&#8217;s the data&#8221; &#183; &#8220;a one-off&#8221; &#183; &#8220;that always happens&#8221; &#183; &#8220;it couldn&#8217;t happen here&#8221;</text>

  <!-- trigger and failure -->
  <line x1="955" y1="410" x2="955" y2="200" stroke="#3f4d5a" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="1090" cy="175" r="52" fill="#c0392b"/>
  <text x="1090" y="182" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">FAILURE</text>
  <text x="1090" y="252" font-size="14" fill="#3f4d5a" text-anchor="middle">Afterwards, the</text>
  <text x="1090" y="270" font-size="14" fill="#3f4d5a" text-anchor="middle">inquiry finds the</text>
  <text x="1090" y="288" font-size="14" fill="#3f4d5a" text-anchor="middle">warnings were there</text>

  <!-- break the chain -->
  <rect x="60" y="540" width="1080" height="72" rx="10" fill="#e6f4ef" stroke="#1d9e75" stroke-width="2"/>
  <text x="86" y="572" font-size="17" font-weight="700" fill="#0f6e56">Break the chain when a warning arrives:</text>
  <text x="86" y="598" font-size="17" fill="#0f6e56">1. Is it real?</text><text x="250" y="598" font-size="17" fill="#0f6e56">2. Does it matter?</text><text x="460" y="598" font-size="17" fill="#0f6e56">3. Decide, and record the decision.</text>

  <text x="1140" y="640" font-size="13" fill="#64748b" text-anchor="end">Based on Barry Turner, Man-made Disasters (1978) &#183; stepchangeanalysis.com</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
